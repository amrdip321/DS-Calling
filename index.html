<script type="module">
/* ================= FIREBASE SETUP ================= */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBe7_n68yQgatGDrxxH6De6dGS1px4G_04",
  authDomain: "ds-calling.firebaseapp.com",
  projectId: "ds-calling",
  storageBucket: "ds-calling.firebasestorage.app",
  messagingSenderId: "1083574697798",
  appId: "1:1083574697798:web:8f087f4bea903a0add2f47",
  measurementId: "G-4SMR31C9FG"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);

/* ================= APP LOGIC ================= */

window.app = {
  user: null,
  tempAuthData: {},

  requestOtp() {
    const email = document.getElementById("email-input").value.trim();
    if (!email) {
      alert("Email required");
      return;
    }

    this.tempAuthData.email = email;

    // UI switch only
    document.getElementById("form-login").classList.remove("active");
    document.getElementById("form-otp").classList.add("active");
    document.getElementById("otp-target").innerText = email;
  },

  async verifyOtp() {
    const email = this.tempAuthData.email;
    const password = "Temp@12345"; // DEV password

    try {
      const cred = await signInWithEmailAndPassword(auth, email, password);
      this.user = cred.user;
    } catch (err) {
      if (err.code === "auth/user-not-found") {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        this.user = cred.user;
      } else {
        alert(err.message);
      }
    }
  },

  logout() {
    signOut(auth);
  }
};

/* ================= AUTH STATE ================= */

onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById("auth-screen").classList.remove("active");
    document.getElementById("main-screen").classList.add("active");
  } else {
    document.getElementById("main-screen").classList.remove("active");
    document.getElementById("auth-screen").classList.add("active");
  }
});
</script>

</body>
</html>
