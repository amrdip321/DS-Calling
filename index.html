<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>D+S Calling</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tone.js for Ringtone -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <style>
        :root {
            --primary: #00A878;
            --primary-dark: #007d59;
            --bg: #121212;
            --container: #1e1e1e;
            --text: #e0e0e0;
            --text-sec: #a0a0a0;
            --danger: #ef4444;
            --bubble-self: #005c42;
            --bubble-other: #2c2c2c;
            --border: #333;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #000;
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #app-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 800px;
            background-color: var(--bg);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
            z-index: 10;
        }

        .screen.active {
            transform: translateX(0);
            z-index: 20;
        }

        /* Headers & Nav */
        header {
            padding: 15px;
            background-color: var(--container);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
        }

        header h2 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--primary);
        }

        .bottom-nav {
            height: 60px;
            background-color: var(--container);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            position: absolute;
            bottom: 0;
            width: 100%;
            z-index: 50;
        }

        .nav-item {
            color: var(--text-sec);
            font-size: 1.5rem;
            padding: 10px;
            cursor: pointer;
            position: relative;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .badge {
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: var(--danger);
            color: white;
            font-size: 0.7rem;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* UI Elements */
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.8; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-sec { background-color: #333; }
        .btn-danger { background-color: var(--danger); }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: var(--container);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            margin-bottom: 10px;
            font-family: inherit;
        }
        
        input:focus { outline: 1px solid var(--primary); }

        .list-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }
        .list-item:active { background-color: #222; }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 15px;
            object-fit: cover;
        }
        
        .item-info { flex: 1; }
        .item-title { font-weight: 600; margin-bottom: 2px; }
        .item-sub { font-size: 0.85rem; color: var(--text-sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
        .item-meta { font-size: 0.75rem; color: var(--text-sec); text-align: right; }

        /* Auth Screen */
        #auth-screen {
            justify-content: center;
            padding: 30px;
            z-index: 100;
        }
        
        .logo { 
            font-size: 3rem; 
            color: var(--primary); 
            text-align: center; 
            margin-bottom: 40px; 
            animation: pulse 2s infinite; 
        }

        /* Chat Screen */
        #chat-screen-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 80px; 
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            position: relative;
            word-wrap: break-word;
            font-size: 0.95rem;
        }

        .msg-self {
            background-color: var(--bubble-self);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .msg-other {
            background-color: var(--bubble-other);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        
        .msg-sender {
            font-size: 0.7rem;
            color: #fab005;
            margin-bottom: 4px;
            display: block;
        }

        .msg-time {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.6);
            margin-top: 4px;
            text-align: right;
        }

        .chat-input-area {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 10px;
            background-color: var(--container);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .typing-indicator {
            padding: 5px 15px;
            font-size: 0.75rem;
            color: var(--primary);
            font-style: italic;
            height: 25px;
        }

        /* Call Screen */
        #call-screen {
            background-color: #000;
            z-index: 200;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video#remote-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        video#local-video {
            position: absolute;
            bottom: 100px;
            right: 20px;
            width: 100px;
            height: 150px;
            background: #333;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid white;
            z-index: 210;
        }

        .call-controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 220;
        }

        .call-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            border: none;
            cursor: pointer;
        }

        /* Incoming Call Modal */
        #incoming-call-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 300;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .pulse-ring {
            border: 3px solid var(--primary);
            border-radius: 50%;
            height: 100px;
            width: 100px;
            position: absolute;
            animation: pulsate 1.5s ease-out infinite;
        }

        @keyframes pulsate {
            0% { transform: scale(0.5); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(1.2); opacity: 0; }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Floating Action Button */
        .fab {
            position: absolute;
            bottom: 80px;
            right: 20px;
            width: 56px;
            height: 56px;
            background-color: var(--primary);
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 40;
            font-size: 1.5rem;
        }

        /* Profile & Side Menu */
        #side-menu {
            position: absolute;
            top: 0; left: 0; width: 70%; height: 100%;
            background: var(--container);
            z-index: 100;
            transform: translateX(-100%);
            transition: transform 0.3s;
            border-right: 1px solid var(--border);
            padding: 20px;
        }
        #side-menu.open { transform: translateX(0); }
        .menu-overlay {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.5); z-index: 99; display: none;
        }

        .tab-content { display: none; height: calc(100% - 120px); overflow-y: auto; }
        .tab-content.active { display: block; }
        
        .empty-state {
            text-align: center;
            color: var(--text-sec);
            margin-top: 50px;
            padding: 20px;
        }

        /* Toast */
        #toast {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 500;
            white-space: nowrap;
        }
        
        /* Auth specific styles */
        .country-input-group {
            display: flex;
            gap: 10px;
        }
        .form-section { display: none; }
        .form-section.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="app-container">
    
    <!-- Auth Screen -->
    <div id="auth-screen" class="screen active">
        <div class="logo"><i class="fas fa-bolt"></i><br>D+S Calling</div>
        
        <!-- Login Form -->
        <div id="form-login" class="form-section active">
            <h3 style="text-align: center;">Welcome</h3>
            <div class="country-input-group">
                <select id="country-code" style="width: 100px;">
                    <!-- Populated via JS -->
                </select>
                <input type="tel" placeholder="Mobile Number" id="phone-number">
            </div>
            <p style="text-align: center; color: var(--text-sec); font-size: 0.8rem; margin: 5px 0 15px 0;">OR</p>
            <input type="email" placeholder="Email Address" id="email-input">
            <button class="btn" onclick="app.requestOtp()">Continue</button>
            <p style="text-align: center; color: var(--text-sec); font-size: 0.7rem; margin-top: 15px;">
                Securely protected by Firebase
            </p>
        </div>

        <!-- OTP Form (Simulated for Demo/Robustness) -->
        <div id="form-otp" class="form-section">
            <h3 style="text-align: center;">Verify</h3>
            <p style="text-align: center; font-size: 0.9rem; color: var(--text-sec);">
                Code sent to <span id="otp-target"></span>
            </p>
            <input type="text" placeholder="Enter Code (123456)" id="otp-input" style="text-align: center; letter-spacing: 5px;">
            <button class="btn" onclick="app.verifyOtp()">Verify</button>
            <button class="btn btn-sec" onclick="app.showLoginForm()">Back</button>
        </div>

        <!-- Profile Setup -->
        <div id="form-setup" class="form-section">
            <h3 style="text-align: center;">Profile</h3>
            <div style="text-align: center; margin-bottom: 20px;">
                <img id="setup-avatar" src="" class="avatar" style="width: 80px; height: 80px; margin: 0 auto;">
            </div>
            <input type="text" placeholder="Display Name" maxlength="20" id="setup-name" oninput="app.updatePreviewAvatar()">
            <input type="text" placeholder="Bio (Optional)" maxlength="100" id="setup-bio">
            <button class="btn" onclick="app.completeSetup()">Start Messaging</button>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="main-screen" class="screen">
        <header>
            <i class="fas fa-bars" onclick="app.toggleMenu()" style="cursor: pointer; font-size: 1.2rem;"></i>
            <h2>D+S Calling</h2>
            <i class="fas fa-sync" onclick="app.refreshData()" style="font-size: 1.2rem;"></i>
        </header>

        <div id="tab-chats" class="tab-content active">
            <!-- Chat List -->
            <div class="empty-state">Loading chats...</div>
        </div>

        <div id="tab-calls" class="tab-content">
            <!-- Call Logs -->
             <div class="empty-state">No recent calls</div>
        </div>

        <div id="tab-people" class="tab-content">
            <div style="padding: 15px;">
                <input type="text" placeholder="Add friend by ID (ar-xxxx)" id="add-friend-input">
                <button class="btn" onclick="app.sendFriendRequest()">Add Friend</button>
            </div>
            <h4 style="padding: 0 15px; margin: 10px 0; font-size: 0.9rem; color: var(--primary);">Requests</h4>
            <div id="requests-list"></div>
            <h4 style="padding: 0 15px; margin: 10px 0; font-size: 0.9rem; color: var(--primary);">Contacts</h4>
            <div id="contacts-list"></div>
        </div>

        <div class="fab" onclick="app.switchTab('people')"><i class="fas fa-plus"></i></div>

        <div class="bottom-nav">
            <div class="nav-item active" id="nav-btn-chats" onclick="app.switchTab('chats')">
                <i class="fas fa-comment-alt"></i>
                <div class="badge" id="nav-chat-badge" style="display:none">0</div>
            </div>
            <div class="nav-item" id="nav-btn-calls" onclick="app.switchTab('calls')">
                <i class="fas fa-phone-alt"></i>
            </div>
            <div class="nav-item" id="nav-btn-people" onclick="app.switchTab('people')">
                <i class="fas fa-users"></i>
                <div class="badge" id="nav-req-badge" style="display:none">0</div>
            </div>
        </div>
    </div>

    <!-- Side Menu -->
    <div class="menu-overlay" id="menu-overlay" onclick="app.toggleMenu()"></div>
    <div id="side-menu">
        <div style="text-align: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 20px;">
            <img id="menu-avatar" class="avatar" style="width: 80px; height: 80px; margin: 0 auto; display: block; margin-bottom: 10px;">
            <h3 id="menu-name" style="margin: 0;">User</h3>
            <p id="menu-id" style="color: var(--primary); font-size: 0.9rem;">ar-0000</p>
        </div>
        <div class="list-item" onclick="alert('Settings feature coming soon')"><i class="fas fa-cog" style="width: 30px;"></i> Settings</div>
        <div class="list-item" onclick="app.logout()"><i class="fas fa-sign-out-alt" style="width: 30px; color: var(--danger);"></i> Logout</div>
    </div>

    <!-- Chat Interface -->
    <div id="chat-interface" class="screen">
        <header>
            <div style="display: flex; align-items: center;">
                <i class="fas fa-arrow-left" onclick="app.closeChat()" style="padding: 10px; margin-right: 5px; cursor: pointer;"></i>
                <img id="chat-header-img" class="avatar" style="width: 35px; height: 35px; margin-right: 10px;">
                <div>
                    <div id="chat-header-name" style="font-size: 0.9rem; font-weight: 600;">Name</div>
                    <div id="chat-header-status" style="font-size: 0.7rem; color: var(--text-sec);">Online</div>
                </div>
            </div>
            <div style="display: flex; gap: 15px;">
                <i class="fas fa-phone" onclick="callManager.startCall(false)"></i>
                <i class="fas fa-video" onclick="callManager.startCall(true)"></i>
                <i class="fas fa-ellipsis-v" onclick="app.toggleChatOptions()"></i>
            </div>
        </header>
        
        <div id="chat-options-menu" style="position: absolute; top: 60px; right: 10px; background: var(--container); border: 1px solid var(--border); border-radius: 8px; display: none; z-index: 100;">
            <div class="list-item" onclick="app.clearChat()">Clear Chat</div>
        </div>

        <div id="chat-screen-content"></div>

        <div class="chat-input-area">
            <i class="fas fa-paperclip" style="font-size: 1.2rem; color: var(--text-sec); cursor: pointer;" onclick="document.getElementById('file-input').click()"></i>
            <input type="file" id="file-input" hidden onchange="app.handleFileUpload(this)">
            <input type="text" id="msg-input" placeholder="Type a message..." style="margin-bottom: 0;" onkeypress="if(event.key==='Enter') app.sendMessage()">
            <i class="fas fa-paper-plane" style="font-size: 1.2rem; color: var(--primary); cursor: pointer;" onclick="app.sendMessage()"></i>
        </div>
    </div>

    <!-- Incoming Call Modal -->
    <div id="incoming-call-modal">
        <div class="pulse-ring"></div>
        <img id="incoming-avatar" class="avatar" style="width: 100px; height: 100px; margin-bottom: 20px; z-index: 2;">
        <h2 id="incoming-name">Caller Name</h2>
        <p id="incoming-type" style="color: var(--text-sec);">Incoming Video Call...</p>
        <div style="display: flex; gap: 40px; margin-top: 40px; z-index: 2;">
            <button class="call-btn btn-danger" onclick="callManager.rejectCall()"><i class="fas fa-times"></i></button>
            <button class="call-btn" style="background-color: var(--primary);" onclick="callManager.acceptCall()"><i class="fas fa-phone"></i></button>
        </div>
    </div>

    <!-- Active Call Screen -->
    <div id="call-screen" class="screen">
        <div class="video-container">
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-video" autoplay playsinline muted></video>
            
            <div class="call-controls">
                <button class="call-btn" style="background-color: #444;" onclick="callManager.toggleMute()" id="mute-btn"><i class="fas fa-microphone"></i></button>
                <button class="call-btn btn-danger" onclick="callManager.endCall()"><i class="fas fa-phone-slash"></i></button>
                <button class="call-btn" style="background-color: #444;" onclick="callManager.toggleVideo()" id="video-btn"><i class="fas fa-video"></i></button>
            </div>
            
            <div id="voice-call-ui" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #121212; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 205; display: none;">
                <img id="call-avatar" class="avatar" style="width: 120px; height: 120px; margin-bottom: 20px;">
                <h2 id="call-name">User</h2>
                <p id="call-status">Connected</p>
            </div>
        </div>
    </div>
    
    <div id="toast">Message</div>

</div>

    const emojiToSVG = (content) => {
        const text = (content || "U").substring(0, 2).toUpperCase();
        const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" style="background-color: black;">

        </svg>`;
        return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    };

    // --- 5. APPLICATION LOGIC ---
    class AppManager {
        constructor() {
            this.user = null;
            this.userData = null;
            this.currentChatId = null;
            this.chatUnsub = null;
            this.populateCountries();
        }
        
        populateCountries() {
            const select = document.getElementById('country-code');
            // Sort by Name
            countryCodes.sort((a,b) => a.name.localeCompare(b.name));
            
            // Set Default
            let optionsHTML = '';
            countryCodes.forEach(c => {
                const isSelected = c.code === '+1' ? 'selected' : '';
                optionsHTML += `<option value="${c.code}" ${isSelected}>${c.name} (${c.code})</option>`;
            });
            select.innerHTML = optionsHTML;
        }

        async init() {
            onAuthStateChanged(auth, async (user) => {
                this.user = user;
                if (user) {
                    await this.loadUserProfile(user.uid);
                } else {
                    this.showScreen('auth-screen');
                    this.showAuthForm('login');
                }
            });
        }

        // --- Auth Flows ---
        requestOtp() {
            const phone = document.getElementById('phone-number').value;
            const email = document.getElementById('email-input').value;
            const code = document.getElementById('country-code').value;
            
            if (!phone && !email) return showToast("Enter phone or email");
            
            this.tempAuthData = { 
                phone: phone ? `${code}${phone}` : null, 
                email: email 
            };
            
            document.getElementById('otp-target').innerText = phone ? `${code}${phone}` : email;
            this.showAuthForm('otp');
            showToast("Simulated Code: 123456");
        }

        async verifyOtp() {
            const otp = document.getElementById('otp-input').value;
            if (otp !== '123456') return showToast("Invalid Code");

            // We perform anonymous auth to get a secure UID from Firebase
            // Then we attach the phone/email to that UID in Firestore
            try {
                if (!this.user) {
                    await signInAnonymously(auth);
                } else {
                    // Already logged in? check profile
                    this.loadUserProfile(this.user.uid);
                }
            } catch (e) {
                showToast("Auth Error: " + e.message);
            }
        }

        async loadUserProfile(uid) {
            const userRef = doc(db, 'users', uid);
            const snap = await getDoc(userRef);
            
            if (snap.exists()) {
                this.userData = snap.data();
                // Update online status
                updateDoc(userRef, { isOnline: true, lastSeen: serverTimestamp() });
                
                this.setupMainListeners();
                this.showScreen('main-screen');
                this.updateMenu();
            } else {
                // New User -> Profile Setup
                this.showScreen('auth-screen');
                this.showAuthForm('setup');
                this.updatePreviewAvatar();
            }
        }

        async completeSetup() {
            const name = document.getElementById('setup-name').value;
            const bio = document.getElementById('setup-bio').value;
            if (!name) return showToast("Name required");

            const publicId = generateId();
            const profile = {
                uid: this.user.uid,
                name, bio,
                publicId,
                avatar: emojiToSVG(name),
                phone: this.tempAuthData?.phone || null,
                email: this.tempAuthData?.email || null,
                createdAt: serverTimestamp(),
                isOnline: true
            };

            await setDoc(doc(db, 'users', this.user.uid), profile);
            // Public mapping for ID search
            await setDoc(doc(db, 'public_users', publicId), { uid: this.user.uid });
            
            this.userData = profile;
            this.setupMainListeners();
            this.showScreen('main-screen');
            this.updateMenu();
        }

        // --- Navigation ---
        showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        showAuthForm(id) {
            document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
            document.getElementById('form-' + id).classList.add('active');
        }
        
        showLoginForm() { this.showAuthForm('login'); }

        switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`nav-btn-${tab}`).classList.add('active');
        }

        toggleMenu() {
            const menu = document.getElementById('side-menu');
            const overlay = document.getElementById('menu-overlay');
            if (menu.classList.contains('open')) {
                menu.classList.remove('open');
                overlay.style.display = 'none';
            } else {
                menu.classList.add('open');
                overlay.style.display = 'block';
            }
        }

        updateMenu() {
            if(!this.userData) return;
            document.getElementById('menu-name').innerText = this.userData.name;
            document.getElementById('menu-id').innerText = this.userData.publicId;
            document.getElementById('menu-avatar').src = this.userData.avatar;
        }

        updatePreviewAvatar() {
            const name = document.getElementById('setup-name').value;
            document.getElementById('setup-avatar').src = emojiToSVG(name);
        }

        logout() {
            signOut(auth);
            location.reload();
        }

        refreshData() {
            // Re-renders are reactive, but sometimes manual refresh helps in dev
            showToast("Refreshed");
        }

        // --- Main App Logic ---
        setupMainListeners() {
            // 1. Listen for Incoming Friend Requests
            onSnapshot(collection(db, 'users', this.user.uid, 'requests'), (snap) => {
                const list = document.getElementById('requests-list');
                list.innerHTML = '';
                let count = 0;
                snap.forEach(d => {
                    const req = d.data();
                    if (req.status === 'pending') {
                        count++;
                        const div = document.createElement('div');
                        div.className = 'list-item';
                        div.innerHTML = `
                            <img src="${req.fromAvatar}" class="avatar">
                            <div class="item-info">
                                <div class="item-title">${req.fromName}</div>
                                <div class="item-sub">Wants to add you</div>
                            </div>
                            <div>
                                <i class="fas fa-check" style="color:var(--primary); margin-right:15px;" onclick="app.acceptRequest('${d.id}', '${req.fromUid}', '${req.fromName}', '${req.fromAvatar}')"></i>
                                <i class="fas fa-times" style="color:var(--danger);" onclick="app.rejectRequest('${d.id}')"></i>
                            </div>`;
                        list.appendChild(div);
                    }
                });
                const badge = document.getElementById('nav-req-badge');
                badge.innerText = count;
                badge.style.display = count > 0 ? 'flex' : 'none';
            });

            // 2. Listen for Contacts
            onSnapshot(collection(db, 'users', this.user.uid, 'contacts'), (snap) => {
                const list = document.getElementById('contacts-list');
                list.innerHTML = '';
                snap.forEach(d => {
                    const c = d.data();
                    const div = document.createElement('div');
                    div.className = 'list-item';
                    div.onclick = () => this.openChatWith(c.uid, c.name, c.avatar);
                    div.innerHTML = `
                        <img src="${c.avatar}" class="avatar">
                        <div class="item-info">
                            <div class="item-title">${c.name}</div>
                            <div class="item-sub">Tap to chat</div>
                        </div>`;
                    list.appendChild(div);
                });
            });

            // 3. Listen for Chats
            onSnapshot(query(collection(db, 'users', this.user.uid, 'chats'), orderBy('lastUpdated', 'desc')), (snap) => {
                const list = document.getElementById('tab-chats');
                list.innerHTML = '';
                if(snap.empty) list.innerHTML = '<div class="empty-state">No active chats</div>';
                
                snap.forEach(d => {
                    const c = d.data();
                    const div = document.createElement('div');
                    div.className = 'list-item';
                    div.onclick = () => this.openChat(c.chatId, c.chatName, c.chatAvatar);
                    div.innerHTML = `
                        <img src="${c.chatAvatar}" class="avatar">
                        <div class="item-info">
                            <div class="item-title">${c.chatName}</div>
                            <div class="item-sub">${c.lastMessage || 'Start conversation'}</div>
                        </div>
                         <div class="item-meta">
                            ${c.lastUpdated ? new Date(c.lastUpdated.seconds*1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : ''}
                        </div>`;
                    list.appendChild(div);
                });
            });

            // 4. Initialize Call Listener
            callManager.listenForCalls();
        }

        // --- Friend Logic ---
        async sendFriendRequest() {
            const targetId = document.getElementById('add-friend-input').value.trim();
            if (!targetId.startsWith('ar-')) return showToast("Invalid ID (must start with ar-)");
            
            // Find UID from Public ID
            const mapSnap = await getDoc(doc(db, 'public_users', targetId));
            if (!mapSnap.exists()) return showToast("User not found");
            
            const targetUid = mapSnap.data().uid;
            if (targetUid === this.user.uid) return showToast("Cannot add yourself");

            await addDoc(collection(db, 'users', targetUid, 'requests'), {
                fromUid: this.user.uid,
                fromName: this.userData.name,
                fromAvatar: this.userData.avatar,
                status: 'pending',
                timestamp: serverTimestamp()
            });
            showToast("Request Sent");
            document.getElementById('add-friend-input').value = '';
        }

        async acceptRequest(reqId, uid, name, avatar) {
            // Add to my contacts
            await setDoc(doc(db, 'users', this.user.uid, 'contacts', uid), { uid, name, avatar });
            // Add me to their contacts (simulated here, ideally triggered by them or Cloud Function)
            // For robustness in this demo, we add specifically to my contacts and update req status
            await updateDoc(doc(db, 'users', this.user.uid, 'requests', reqId), { status: 'accepted' });
            
            // Create Reverse Contact for them (since we are admin of our own DB writes in this demo context)
            // Note: In strict production rules, you can't write to other user's contacts. 
            // Assuming open rules for demo:
            try {
                await setDoc(doc(db, 'users', uid, 'contacts', this.user.uid), { 
                    uid: this.user.uid, 
                    name: this.userData.name, 
                    avatar: this.userData.avatar 
                });
            } catch(e) { console.log("Could not add reverse contact (permission issue?)"); }
        }

        rejectRequest(reqId) {
            updateDoc(doc(db, 'users', this.user.uid, 'requests', reqId), { status: 'rejected' });
        }

        // --- Chat Logic ---
        async openChatWith(uid, name, avatar) {
            // Deterministic Chat ID: minUid_maxUid
            const chatId = [this.user.uid, uid].sort().join('_');
            
            // Ensure chat metadata exists for me
            await setDoc(doc(db, 'users', this.user.uid, 'chats', chatId), {
                chatId, chatName: name, chatAvatar: avatar, peerUid: uid, lastUpdated: serverTimestamp()
            }, { merge: true });

            // Ensure chat metadata exists for them
            try {
                await setDoc(doc(db, 'users', uid, 'chats', chatId), {
                    chatId, chatName: this.userData.name, chatAvatar: this.userData.avatar, peerUid: this.user.uid, lastUpdated: serverTimestamp()
                }, { merge: true });
            } catch(e) {}

            this.openChat(chatId, name, avatar);
        }

        openChat(chatId, name, avatar) {
            this.currentChatId = chatId;
            document.getElementById('chat-header-name').innerText = name;
            document.getElementById('chat-header-img').src = avatar;
            this.showScreen('chat-interface');
            
            // Load Messages
            const container = document.getElementById('chat-screen-content');
            if(this.chatUnsub) this.chatUnsub();
            
            const q = query(collection(db, 'chats', chatId, 'messages'), orderBy('timestamp', 'asc'));
            this.chatUnsub = onSnapshot(q, (snap) => {
                container.innerHTML = '';
                snap.forEach(d => {
                    const m = d.data();
                    const div = document.createElement('div');
                    const isSelf = m.senderId === this.user.uid;
                    div.className = `message ${isSelf ? 'msg-self' : 'msg-other'}`;
                    
                    let content = m.text;
                    if(m.type === 'image') content = `<img src="${m.url}" style="max-width:100%; border-radius:8px;">`;
                    
                    div.innerHTML = `
                        ${!isSelf ? `<span class="msg-sender">${m.senderName}</span>` : ''}
                        ${content}
                        <div class="msg-time">${m.timestamp ? new Date(m.timestamp.seconds*1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '...'}</div>
                    `;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        closeChat() {
            this.currentChatId = null;
            if(this.chatUnsub) this.chatUnsub();
            this.showScreen('main-screen');
        }

        async sendMessage(type='text', url=null) {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if(!text && type==='text') return;

            const msgData = {
                senderId: this.user.uid,
                senderName: this.userData.name,
                text: type === 'text' ? text : 'Media',
                type,
                url,
                timestamp: serverTimestamp()
            };

            await addDoc(collection(db, 'chats', this.currentChatId, 'messages'), msgData);
            
            // Update last message
            const lastText = type === 'text' ? text : '📷 Image';
            await updateDoc(doc(db, 'users', this.user.uid, 'chats', this.currentChatId), { lastMessage: lastText, lastUpdated: serverTimestamp() });
            
            // Find peer ID from chat ID logic (simple parse) to update their list
            // Or rely on the 'openChatWith' structure. 
            // In robust apps, use Cloud Functions. Here, we try direct write:
            try {
                const parts = this.currentChatId.split('_');
                const peerId = parts[0] === this.user.uid ? parts[1] : parts[0];
                await updateDoc(doc(db, 'users', peerId, 'chats', this.currentChatId), { lastMessage: lastText, lastUpdated: serverTimestamp() });
            } catch(e) {}

            input.value = '';
        }

        handleFileUpload(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                this.sendMessage('image', e.target.result); // In prod, upload to Storage
            };
            reader.readAsDataURL(file);
        }

        clearChat() {
            document.getElementById('chat-screen-content').innerHTML = '';
            showToast("Chat cleared locally");
            this.toggleChatOptions();
        }
        
        toggleChatOptions() {
            const m = document.getElementById('chat-options-menu');
            m.style.display = m.style.display === 'block' ? 'none' : 'block';
        }
    }

    // --- 6. WEBRTC CALLING ---
    class CallManager {
        constructor() {
            this.peerConn = null;
            this.localStream = null;
            this.callId = null;
            this.cleanupUnsub = null;
            this.ringtone = new Tone.Synth({ oscillator: { type: "triangle" } }).toDestination();
            this.ringLoop = null;
            this.config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        }

        async listenForCalls() {
            // Listen for calls offered to me
            const q = query(collection(db, 'calls'), where('targetUid', '==', app.user.uid), where('status', '==', 'offering'));
            onSnapshot(q, (snap) => {
                snap.docChanges().forEach(change => {
                    if (change.type === 'added') {
                        const data = change.doc.data();
                        this.handleIncoming(change.doc.id, data);
                    }
                });
            });
        }

        async startCall(isVideo) {
            if(!app.currentChatId) return;
            // Identify Target
            const parts = app.currentChatId.split('_');
            const targetUid = parts[0] === app.user.uid ? parts[1] : parts[0];
            
            this.callId = generateId();
            
            try {
                this.localStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
                document.getElementById('local-video').srcObject = this.localStream;
            } catch(e) { return showToast("Permission Denied: " + e.message); }

            this.peerConn = new RTCPeerConnection(this.config);
            this.localStream.getTracks().forEach(t => this.peerConn.addTrack(t, this.localStream));
            
            this.peerConn.onicecandidate = (e) => {
                if(e.candidate) updateDoc(doc(db, 'calls', this.callId), { offerCandidates: arrayUnion(JSON.stringify(e.candidate)) });
            };
            
            this.peerConn.ontrack = (e) => {
                document.getElementById('remote-video').srcObject = e.streams[0];
            };

            const offer = await this.peerConn.createOffer();
            await this.peerConn.setLocalDescription(offer);

            // Create Call Doc
            await setDoc(doc(db, 'calls', this.callId), {
                callId: this.callId,
                callerUid: app.user.uid,
                callerName: app.userData.name,
                callerAvatar: app.userData.avatar,
                targetUid: targetUid,
                type: isVideo ? 'video' : 'voice',
                offer: { type: offer.type, sdp: offer.sdp },
                status: 'offering',
                timestamp: serverTimestamp()
            });

            this.setupCallUI(isVideo, true);
            this.monitorCall(this.callId);
        }

        handleIncoming(id, data) {
            this.callId = id;
            document.getElementById('incoming-name').innerText = data.callerName;
            document.getElementById('incoming-avatar').src = data.callerAvatar;
            document.getElementById('incoming-type').innerText = `Incoming ${data.type} call...`;
            document.getElementById('incoming-call-modal').style.display = 'flex';
            this.startRinging();
        }

        async acceptCall() {
            this.stopRinging();
            document.getElementById('incoming-call-modal').style.display = 'none';
            
            const callDoc = await getDoc(doc(db, 'calls', this.callId));
            const data = callDoc.data();
            const isVideo = data.type === 'video';

            try {
                this.localStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
                document.getElementById('local-video').srcObject = this.localStream;
            } catch(e) { return showToast("Mic/Cam Error"); }

            this.peerConn = new RTCPeerConnection(this.config);
            this.localStream.getTracks().forEach(t => this.peerConn.addTrack(t, this.localStream));
            
            this.peerConn.onicecandidate = (e) => {
                if(e.candidate) updateDoc(doc(db, 'calls', this.callId), { answerCandidates: arrayUnion(JSON.stringify(e.candidate)) });
            };
            
            this.peerConn.ontrack = (e) => {
                document.getElementById('remote-video').srcObject = e.streams[0];
            };

            await this.peerConn.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await this.peerConn.createAnswer();
            await this.peerConn.setLocalDescription(answer);

            await updateDoc(doc(db, 'calls', this.callId), {
                answer: { type: answer.type, sdp: answer.sdp },
                status: 'answered'
            });

            this.setupCallUI(isVideo, false);
            this.monitorCall(this.callId);
        }

        monitorCall(id) {
            this.cleanupUnsub = onSnapshot(doc(db, 'calls', id), (snap) => {
                const data = snap.data();
                if(!data) return;
                
                if(data.status === 'ended') return this.endCall(false);
                
                if(this.peerConn && !this.peerConn.currentRemoteDescription && data.answer) {
                    this.peerConn.setRemoteDescription(new RTCSessionDescription(data.answer));
                }
                
                if(this.peerConn && data.offerCandidates && !this.isCaller) {
                     // In full impl, add candidates carefully. Here simple approach:
                     data.offerCandidates.forEach(c => this.peerConn.addIceCandidate(new RTCIceCandidate(JSON.parse(c))).catch(e=>{}));
                }
                
                if(this.peerConn && data.answerCandidates && this.isCaller) {
                     data.answerCandidates.forEach(c => this.peerConn.addIceCandidate(new RTCIceCandidate(JSON.parse(c))).catch(e=>{}));
                }
            });
        }

        rejectCall() {
            this.stopRinging();
            document.getElementById('incoming-call-modal').style.display = 'none';
            if(this.callId) updateDoc(doc(db, 'calls', this.callId), { status: 'rejected' });
        }

        endCall(updateDB=true) {
            if(updateDB && this.callId) updateDoc(doc(db, 'calls', this.callId), { status: 'ended' });
            
            if(this.localStream) this.localStream.getTracks().forEach(t => t.stop());
            if(this.peerConn) this.peerConn.close();
            if(this.cleanupUnsub) this.cleanupUnsub();
            
            this.peerConn = null;
            this.localStream = null;
            this.stopRinging();
            
            app.showScreen('main-screen');
        }

        setupCallUI(isVideo, isCaller) {
            this.isCaller = isCaller;
            app.showScreen('call-screen');
            if(isVideo) {
                document.getElementById('local-video').style.display = 'block';
                document.getElementById('voice-call-ui').style.display = 'none';
            } else {
                document.getElementById('local-video').style.display = 'none';
                document.getElementById('voice-call-ui').style.display = 'flex';
                // Set avatar info
                const target = document.getElementById('chat-header-name').innerText; // fallback
                document.getElementById('call-name').innerText = target;
            }
        }

        toggleMute() {
            const track = this.localStream.getAudioTracks()[0];
            track.enabled = !track.enabled;
            document.getElementById('mute-btn').style.background = track.enabled ? '#444' : 'var(--danger)';
        }

        toggleVideo() {
            const track = this.localStream.getVideoTracks()[0];
            track.enabled = !track.enabled;
            document.getElementById('video-btn').style.background = track.enabled ? '#444' : 'var(--danger)';
        }

        startRinging() {
            Tone.start();
            this.ringLoop = new Tone.Loop(time => {
                this.ringtone.triggerAttackRelease("C4", "8n", time);
                this.ringtone.triggerAttackRelease("E4", "8n", time + 0.2);
            }, "1n").start(0);
            Tone.Transport.start();
        }

        stopRinging() {
            if(this.ringLoop) { this.ringLoop.dispose(); this.ringLoop=null; }
            Tone.Transport.stop();
        }
    }

    // --- 7. STARTUP ---
    const app = new AppManager();
    const callManager = new CallManager();
    window.app = app;
    window.callManager = callManager;
    app.init();

</script>
